<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Global Error Banner: <output> untuk notifikasi hasil operasi aplikasi -->
  <output id="global-error" class="global-error hidden" role="alert"></output>

  <!-- Header -->
  <header class="header">
    <h1 class="header__title">Expense &amp; Budget Visualizer</h1>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light mode">
      <span class="theme-toggle__icon">🌙</span>
    </button>
  </header>

  <main class="main-layout">

    <!-- Left Column: Input Form + Add Category -->
    <aside class="sidebar">

      <!-- Transaction Form -->
      <section class="card" aria-labelledby="form-heading">
        <h2 id="form-heading" class="card__title">Tambah Pengeluaran</h2>
        <form id="transaction-form" novalidate>

          <p class="form-group">
            <label for="input-name" class="form-label">Nama Item</label>
            <input
              type="text"
              id="input-name"
              class="form-input"
              placeholder="Contoh: Makan siang"
              autocomplete="off"
            />
            <output id="error-name" class="error-message" for="input-name"></output>
          </p>

          <p class="form-group">
            <label for="input-amount" class="form-label">Jumlah (Rp)</label>
            <input
              type="number"
              id="input-amount"
              class="form-input"
              placeholder="Contoh: 35000"
              min="1"
            />
            <output id="error-amount" class="error-message" for="input-amount"></output>
          </p>

          <p class="form-group">
            <label for="input-category" class="form-label">Kategori</label>
            <select id="input-category" class="form-input form-select">
              <option value="">-- Pilih Kategori --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <output id="error-category" class="error-message" for="input-category"></output>
          </p>

          <button type="submit" class="btn btn--primary btn--full">Tambah</button>
        </form>
      </section>

      <!-- Add Custom Category -->
      <section class="card" aria-labelledby="category-heading">
        <h2 id="category-heading" class="card__title">Tambah Kategori</h2>
        <form id="add-category-form" class="add-category-form" novalidate>
          <p class="form-group">
            <label for="input-new-category" class="form-label">Nama Kategori Baru</label>
            <input
              type="text"
              id="input-new-category"
              class="form-input"
              placeholder="Contoh: Kesehatan"
              autocomplete="off"
              maxlength="30"
            />
            <output id="error-new-category" class="error-message" for="input-new-category"></output>
          </p>
          <button id="btn-add-category" type="button" class="btn btn--secondary btn--full">
            + Tambah Kategori
          </button>
        </form>
      </section>

    </aside>

    <!-- Right Column: Balance + Chart -->
    <section class="content">

      <!-- Total Balance: <article> karena merupakan ringkasan konten mandiri -->
      <article class="card balance-card" aria-label="Total pengeluaran">
        <p class="balance-card__label">Total Pengeluaran</p>
        <strong id="balance-display" class="balance-card__amount">Rp 0</strong>
      </article>

      <!-- Pie Chart: <article> + <figure> untuk konten visual mandiri -->
      <article class="card chart-card">
        <h2 class="card__title">Distribusi Pengeluaran</h2>
        <figure id="chart-container">
          <canvas id="expense-chart" aria-label="Pie chart distribusi pengeluaran"></canvas>
          <figcaption id="chart-empty" class="empty-state hidden">
            Belum ada data pengeluaran
          </figcaption>
        </figure>
      </article>

    </section>

  </main>

  <!-- Transaction List -->
  <div class="transaction-wrapper">
    <section class="transaction-section" aria-labelledby="list-heading">
      <header class="transaction-header">
        <h2 id="list-heading" class="card__title">Riwayat Transaksi</h2>
        <fieldset class="sort-control">
          <legend class="sort-label">Urutkan:</legend>
          <select id="sort-control" class="form-input form-select sort-select">
            <option value="date-desc">Terbaru</option>
            <option value="amount-desc">Jumlah: Terbesar</option>
            <option value="amount-asc">Jumlah: Terkecil</option>
            <option value="category-asc">Kategori: A–Z</option>
          </select>
        </fieldset>
      </header>

      <ul id="transaction-list" class="transaction-list">
        <li id="list-empty" class="empty-state">
          Belum ada transaksi. Tambahkan pengeluaran pertama Anda!
        </li>
      </ul>
    </section>
  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/app.js" defer></script>

</body>
</html>
